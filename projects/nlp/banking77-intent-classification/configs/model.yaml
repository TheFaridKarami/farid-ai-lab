classical:
  features:
    bow:
      max_features: 20000
      ngram_range: [1, 2]
      min_df: 2

    tfidf:
      max_features: 20000
      ngram_range: [1, 2]
      min_df: 2

  models:
    logistic_regression:
      max_iter: 1000
      C: 1.0

    linear_svc:
      C: 1.0

    multinomial_nb:
      alpha: 1.0

    complement_nb:
      alpha: 1.0

    sgd_classifier:
      loss: log_loss
      max_iter: 1000
      random_state: 42


neural:
  vocab_size: 5000
  sequence_length: 79

  batch_size: 64
  learning_rate: 0.001
  epochs: 50

  embedding_dim: 128
  hidden_dim: 128
  dropout: 0.2

  seed: 42
  grad_clip: 1.0
  patience: 5

  num_layers: 2
  bidirectional: True


transformer:
  vocab_size: 8000
  sequence_length: 100
  max_length: 128
  embedding_dim: 128
  num_heads: 4
  num_layers: 4
  feedforward_dim: 512
  dropout: 0.2
  batch_size: 64
  learning_rate: 0.0001
  epochs: 50
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  patience: 5
  seed: 42
