[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking77-intent-classification"
version = "0.1.0"
description = "Intent classification on the BANKING77 dataset using classical ML and neural networks."
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "PyYAML",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
transformers = [
    "transformers",
    "accelerate",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]